syntax = "proto3";

package Protocol;
option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
  S_ENTER_GAME = 0;
  S_LEAVE_GAME = 1;
  S_CONNECTED = 2;
  S_SPAWN = 3;
  S_DESPAWN = 4;
  C_LOGIN = 5;
  S_LOGIN = 6;
  C_ENTER_GAME = 7;
  C_CREATE_PLAYER = 8;
  S_CREATE_PLAYER = 9;
  S_ITEM_LIST = 10;
  S_ADD_ITEM = 11;
  C_EQUIP_ITEM = 12;
  S_EQUIP_ITEM = 13;
  S_CHANGE_STAT = 14;
  S_PING = 15;
  C_PONG = 16;
  C_REQUEST_DUEL = 17;
  S_REQUEST_SEND_OK = 18;
  S_REQUEST_DUEL = 19;
  C_RESPOND_DUEL = 20;
  S_RESPOND_DUEL = 21;
  C_SELECT_MST = 22;
  S_START_BATTLE = 23;
  C_TURN = 24;
  S_TURN_BATTLE = 25;
  S_TURN_POKEBALL = 26;
  S_TURN_CHANGE = 27;
  S_TURN_RUNAWAY = 28;
  S_TURN_PASS = 29;
  C_TURN_End = 30;
  S_TURN = 31;
}

enum GameObjectType {
  NONETYPE = 0;
  PLAYER = 1;
  MONSTER = 2;
  PROJECTILE = 3;
}

enum PlayerServerState {
  SERVER_STATE_LOGIN = 0;
  SERVER_STATE_LOBBY = 1;
  SERVER_STATE_GAME = 2;
}

enum ItemType {
  ITEM_TYPE_NONE = 0;
  ITEM_TYPE_WEAPON = 1;
  ITEM_TYPE_ARMOR = 2;
  ITEM_TYPE_CONSUMABLE = 3;
}

enum ConsumableType {
  CONSUMABLE_TYPE_NONE = 0;
  CONSUMABLE_TYPE_POTION = 1;
}

enum ActionType {
  PASS = 0;
  FIGHT = 1;
  POKEBALL = 2;
  CHANGE = 3;
  RUNAWAY = 4;
}

enum Type {   
  NOTYPE = 0;
  BUG = 1;
  DARK = 2;
  DRAGON = 3;
  ELECTRIC= 4;
  FAIRY = 5;
  FIGHTING = 6;
  FIRE = 7;
  FLYING = 8;
  GHOST = 9;
  GRASS = 10;
  GROUND = 11;
  ICE = 12;
  NORMAL = 13;
  POISON = 14;
  PSYCHIC= 15;
  ROCK = 16;
  STEEL = 17;
  WATER = 18;
}

enum Arenas {
  ABYSS_ = 0;
  BADLANDS_ = 1;
  BEACH_ = 2;
  CAVE_ = 3;
  CONSTRUCTIONSITE_ = 4;
  DESERT_ = 5;
  DOJO = 6;
  FACTORY_ = 7;
  FAIRYCAVE_ = 8;
  FOREST_ = 9;
  GRASS_ = 10;
  GRAVEYARD_ = 11;
  ICECAVE_ = 12;
  ISLAND_ = 13;
  JUNGLE_ = 14;
  LABORATORY_ = 15;
  LAKE_ = 16;
  MEADOW_ = 17;
  METROPOLIS_ = 18;
  MOUNTAIN_ = 19;
  PLAINS_ = 20;
  POWERPLANT_ = 21;
  RUINS_ = 22;
  SEA_ = 23;
  SEABED_ = 24;
  SLUM_ = 25;
  SNOWYFOREST_ = 26;
  SPACE_ = 27;
  SWAMP_ = 28;
  TALLGRASS_ = 29;
  TEMPLE_ = 30;
  TOWN_ = 31;
  VOLCANO_ = 32;
  WASTELAND_ = 33;
  END_ = 34;
}

enum TargetType {
  ONESELF = 0;
  ENEMY = 1;
  END = 2;
}

enum SkillType {	
  NONE = 0;
  ATK = 1;
  SPA = 2;
  RECOVERY = 3;
  BUFF_ATK = 4;
  BUFF_SPA = 5;
  BUFF_DEF = 6;
  BUFF_SPD = 7;
  BUFF_SPE = 8;
  DOT = 9;
  STATUS_EFFECT = 10;
  DEBUFF_ATK = 11;
  DEBUFF_SPA = 12;
  DEBUFF_DEF = 13;
  DEBUFF_SPD = 14;
  DEBUFF_SPE = 15;
  STURN = 16;
  CONFUSION = 17;
}

enum EffectiveType {
  COMMONEFFECT = 0;
  EFFECTIVE = 1;
  INEFFECTIVE = 2;
}

message S_EnterGame {
  ObjectInfo player = 1;
}

message S_LeaveGame {
}

message S_Spawn {
  repeated ObjectInfo objects = 1;
}

message S_Despawn {
  repeated int32 objectIds = 1;
}

message S_Connected {
}

message C_Login {
  string uniqueId = 1;
}

message S_Login {
  int32 loginOk = 1;
  repeated LobbyPlayerInfo players = 2;
}

message C_CreatePlayer {
  string name = 1;
}

message S_CreatePlayer {
  LobbyPlayerInfo player = 1;
}

message C_EnterGame {
  string name = 1;
}

message C_RequestDuel {		
  int32 applyId = 1;
  int32 enemyId = 2;
}

message S_RequestSendOk {
  int32 sendOK = 1;
}

message S_RequestDuel {
  int32 requestId = 1;
}

message C_RespondDuel {
  int32 respondId = 1;
  int32 enemyId = 2;
  int32 duelOK = 3;
}

message S_RespondDuel {
  int32 duelOK = 1;
  int32 enemyId = 2;
}

message S_ItemList {
  repeated ItemInfo items = 1;
}

message S_AddItem {
  repeated ItemInfo items = 1;
}

message C_EquipItem {
  int32 itemDbId = 1;
  bool equipped = 2;
}

message S_EquipItem {
  int32 itemDbId = 1;
  bool equipped = 2;
}

message S_ChangeStat {
  PokemonInfo statInfo = 1;
}

message S_Ping {
}

message C_Pong {
}

message C_SelectMst {
  int32 playerId = 1;
  repeated int32 mstList = 2;
}

message S_StartBattle {
  int32 arenaType = 1;
  ObjectInfo myInfo = 2;
  ObjectInfo enemyInfo = 3;
  repeated int32 myMst = 4;
  repeated int32 enemyMst = 5;
  bool myTurn = 6;
}

message C_Turn {
  int32 playerId = 1;
  TurnInfo turnInfo = 2;
}

message S_TurnBattle {
  int32 playerId = 1;
  int32 skillId = 2;
  repeated BattleInfo turnInfo = 3;
  repeated BattleInfo info = 4;
}

message S_TurnPokeball {
  int32 playerId = 1;
  repeated BattleInfo turnInfo = 2;
  PokeballInfo info = 3;
}

message S_TurnChange {
  int32 playerId = 1;
  ChangeInfo info = 2;
}

message S_TurnRunaway {
}

message S_TurnPass {
  int32 playerId = 1;
  repeated BattleInfo turnInfo = 2;
}

message C_TurnEnd {
  int32 playerId = 1;
}

message S_Turn {
  int32 playerId = 1;
  bool myTurn = 2;
}

message LobbyPlayerInfo {
  int32 playerDbId = 1;
  string name = 2;
}

message ObjectInfo {
  int32 objectId = 1;
  string name = 2;
}

message TurnInfo {
  ActionType action  = 1;
  int32 skillNum = 2;
  int32 ballType = 3;
  int32 changeNum = 4;
}

message BattleInfo {
  SkillType skillType = 1;
  TargetType targetType = 2;
  EffectiveType effective = 3;
  PokemonInfo myInfo = 4;
  PokemonInfo enemyInfo = 5;
  StateInfo stateInfo = 6;
}

message PokeballInfo {
  int32 info = 1;
}

message ChangeInfo {
  int32 info = 1;
}

message StateInfo {
  bool isMiss = 1;
  bool isSturn = 2;
  bool isConfusion = 3;
  bool recoverFromSturn = 4;
  bool recoverFromConfusion = 5;
  int32 skillId = 6;
}

message PokemonInfo {
  int32 level = 1;
  int32 hp = 2;
  int32 atk = 3;
  int32 spA = 4;
  int32 def = 5;
  int32 spD = 6;
  int32 spe = 7;
  int32 exp = 8;
  ConditionAbnormality state = 9;
  repeated Type type = 10;
  repeated int32 skillId = 11;
}

message ConditionAbnormality {
  int32 sturn = 1;
  int32 confusion = 2;
  int32 fire = 3;
  int32 poison = 4;
  int32 dot = 5;
}

message SkillEffect {
  SkillType skillType = 1;
  TargetType target = 2;
  Type type = 3;
  int32 value = 4;
  int32 accuracy = 5;
  int32 duration = 6;
}

message SkillInfo {
  repeated SkillEffect skillEffect = 1;
  int32 pp = 2;
}

message ItemInfo {
  int32 itemDbId = 1;
  int32 templateId = 2;
  int32 count = 3;
  int32 slot = 4;
  bool equipped = 5;
}