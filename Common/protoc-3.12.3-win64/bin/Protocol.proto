syntax = "proto3";

package Protocol;
option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
  S_ENTER_GAME = 0;
  S_LEAVE_GAME = 1;
  S_CONNECTED = 2;
  S_SPAWN = 3;
  S_DESPAWN = 4;
  C_LOGIN = 5;
  S_LOGIN = 6;
  C_ENTER_GAME = 7;
  C_CREATE_PLAYER = 8;
  S_CREATE_PLAYER = 9;
  S_ITEM_LIST = 10;
  S_ADD_ITEM = 11;
  C_EQUIP_ITEM = 12;
  S_EQUIP_ITEM = 13;
  S_CHANGE_STAT = 14;
  S_PING = 15;
  C_PONG = 16;
  C_REQUEST_DUEL = 17;
  S_REQUEST_SEND_OK = 18;
  S_REQUEST_DUEL = 19;
  C_RESPOND_DUEL = 20;
  S_RESPOND_DUEL = 21;
}

enum GameObjectType {
  NONETYPE = 0;
  PLAYER = 1;
  MONSTER = 2;
  PROJECTILE = 3;
}

enum PlayerServerState {
  SERVER_STATE_LOGIN = 0;
  SERVER_STATE_LOBBY = 1;
  SERVER_STATE_GAME = 2;
}

enum ItemType {
  ITEM_TYPE_NONE = 0;
  ITEM_TYPE_WEAPON = 1;
  ITEM_TYPE_ARMOR = 2;
  ITEM_TYPE_CONSUMABLE = 3;
}

enum ConsumableType {
  CONSUMABLE_TYPE_NONE = 0;
  CONSUMABLE_TYPE_POTION = 1;
}

enum ActionType
{
  NONE = 0;
  FIGHT = 1;
  POKEBALL = 2;
  CHANGE = 3;
  RUNAWAY = 4;
}

 enum Type 
{   
  NORMAL = 0;
  FIGHTING = 1;
  FLYING = 2;
  POISON = 3;
  GROUND = 4;
  ROCK = 5;
  BUG = 6;
  GHOST = 7;
  STEEL = 8;
  FIRE = 9;
  WATER = 10;
  GRASS = 11;
  ELECTRIC= 12;
  PSYCHIC= 13;
  ICE = 14;
  DRAGON = 15;
  DARK = 16;
  FAIRY = 17;
}

enum SkillType
{	
  ATK = 0;
  SPA = 1;
  BUFF = 2;
  DEBUFF = 3;
}

message S_EnterGame {
  ObjectInfo player = 1;
}

message S_LeaveGame {
}

message S_Spawn {
  repeated ObjectInfo objects = 1;
}

message S_Despawn {
  repeated int32 objectIds = 1;
}

message S_Connected {
}

message C_Login {
  string uniqueId = 1;
}

message S_Login {
  int32 loginOk = 1;
  repeated LobbyPlayerInfo players = 2;
}

message C_CreatePlayer {
  string name = 1;
}

message S_CreatePlayer {
  LobbyPlayerInfo player = 1;
}

message C_EnterGame {
  string name = 1;
}

message C_RequestDuel {		
  int32 applyId = 1;
  int32 opponentId = 2;
}

message S_RequestSendOk {
  int32 sendOK = 1;
}

message S_RequestDuel {
  int32 requestId = 1;
}

message C_RespondDuel {
  int32 respondId = 1;
  int32 opponentId = 2;
  int32 duelOK = 3;
}

message S_RespondDuel {
  int32 duelOK = 1;
  int32 opponentId = 2;
}

message S_ItemList {
  repeated ItemInfo items = 1;
}

message S_AddItem {
  repeated ItemInfo items = 1;
}

message C_EquipItem {
  int32 itemDbId = 1;
  bool equipped = 2;
}

message S_EquipItem {
  int32 itemDbId = 1;
  bool equipped = 2;
}

message S_ChangeStat {
  PokemonInfo statInfo = 1;
}

message S_Ping {
}

message C_Pong {
}

message LobbyPlayerInfo {
  int32 playerDbId = 1;
  string name = 2;
}

message ObjectInfo {
  int32 objectId = 1;
  string name = 2;
  PokemonList pKMList = 3;
}

message TurnInfo
{
  ActionType action  = 1;
  int32 skillNum = 2;
  int32 ballType = 3;
  int32 changeNum = 4;
}

message PokemonList
{
  int32 pokemon_0 = 1;
  int32 pokemon_1 = 2;
  int32 pokemon_2 = 3;
  int32 pokemon_3 = 4;
  int32 pokemon_4 = 5;
  int32 pokemon_5 = 6;
}

message PokemonInfo {
  int32 level = 1;
  int32 hp = 2;
  int32 maxHp = 3;
  int32 atk = 4;
  int32 spA = 5;
  int32 def = 6;
  int32 spD = 7;
  int32 spe = 8;
  repeated Type type = 9;
  int32 exp = 10;
  repeated int32 skillId = 11;
}

message SkillInfo {
  int32 skillId = 1;
  SkillType type = 2;
  int32 value = 3;
}

message ItemInfo {
  int32 itemDbId = 1;
  int32 templateId = 2;
  int32 count = 3;
  int32 slot = 4;
  bool equipped = 5;
}